input_driver = "sdl2"
input_device = "ZhiXu Gamepad"
input_vendor_id = "121"
input_product_id = "6172"

# ---- 按键（SDL 按钮序号 = evdev BTN_* 码升序 → 0..14）----
# BTN_A(304)=0  BTN_B(305)=1  BTN_C(306)=2  BTN_X(307)=3  BTN_Y(308)=4
# BTN_Z(309)=5  BTN_TL(310)=6 BTN_TR(311)=7 BTN_TL2(312)=8 BTN_TR2(313)=9
# BTN_SELECT(314)=10 BTN_START(315)=11 BTN_MODE(316)=12
# BTN_THUMBL(317)=13 BTN_THUMBR(318)=14 ；dpad = hat0，摇杆 = 轴 0..3
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "3"
input_y_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "8"
input_r2_btn = "9"
input_l3_btn = "13"
input_r3_btn = "14"
input_select_btn = "10"
input_start_btn = "11"

# ---- 十字键 ----
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# ---- 摇杆（左 = 轴0/1，右 = 轴2/3；轴4/5 是 Gas/Brake，本手柄不用）----
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# ---- 手柄上的标签 ----
input_a_btn_label = "A"
input_b_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"

# ---- 热键：R3(14)。以前放在 LB(6) 上，导致 LB 永远不能当 L1 用 ----
input_enable_hotkey_btn = "14"
input_exit_emulator_btn = "11"
input_menu_toggle_btn = "13"
